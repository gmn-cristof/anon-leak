name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: anon-leak-linux
          - os: macos-latest
            artifact: anon-leak-macos
          - os: windows-latest
            artifact: anon-leak-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build anon_leak
        run: pyinstaller --onefile --name anon_leak --console anon_leak.py

      - name: Build chain_verify
        run: pyinstaller --onefile --name chain_verify --console chain_verify.py

      - name: Build chain_post
        run: pyinstaller --onefile --name chain_post --console chain_post.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/anon_leak*
            dist/chain_verify*
            dist/chain_post*
            README.md
            LICENSE

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
