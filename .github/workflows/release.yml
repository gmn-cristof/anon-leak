name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux
            ext: ''
          - os: macos-latest
            tag: macos
            ext: ''
          - os: windows-latest
            tag: windows
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      # 如果项目有依赖，取消下面注释
      # - name: Install requirements
      #   run: pip install -r requirements.txt

      - name: Build
        shell: bash
        run: |
          pyinstaller --onefile --name anon_leak-${{ matrix.tag }}   --console anon_leak.py
          pyinstaller --onefile --name chain_verify-${{ matrix.tag }} --console chain_verify.py
          pyinstaller --onefile --name chain_post-${{ matrix.tag }}   --console chain_post.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tag }}-builds
          path: |
            dist/anon_leak*
            dist/chain_verify*
            dist/chain_post*
            README.md
            LICENSE

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show files
        run: find artifacts -type f

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true